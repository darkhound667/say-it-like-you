# Netlify hosts only the static page (frontend/index.html).
# The Flask backend (server.py, holds the Sarvam key) must run elsewhere (tunnel, Render, Railway...).
# Replace BACKEND_URL below with that backend's public https host (no scheme, no trailing slash);
# Netlify then forwards /api/* to it, so the page and the API share one origin (no CORS needed).

[build]
  publish = "frontend"

[[redirects]]
  from = "/api/*"
  to = "https://BACKEND_URL/api/:splat"
  status = 200
  force = true
